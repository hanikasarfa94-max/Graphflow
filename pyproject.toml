[project]
name = "workgraph-ai"
version = "0.1.0"
description = "WorkGraph AI — coordination as a graph, not a document."
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/schemas",
    "packages/observability",
    "packages/persistence",
    "packages/domain",
    "packages/agents",
    "packages/orchestrator",
    "packages/feishu_adapter",
]

[tool.uv.sources]
workgraph-schemas = { workspace = true }
workgraph-observability = { workspace = true }
workgraph-persistence = { workspace = true }
workgraph-domain = { workspace = true }
workgraph-agents = { workspace = true }
workgraph-orchestrator = { workspace = true }
workgraph-feishu-adapter = { workspace = true }
workgraph-api = { workspace = true }
workgraph-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tests"]
pythonpath = ["apps/worker/src"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not eval'"
python_files = ["test_*.py", "canonical_*.py"]
markers = [
    "eval: hits a live LLM (DeepSeek); opt-in with `-m eval`",
]

# Architectural invariants, enforced in CI (`uv run lint-imports`).
# See CLAUDE.md §"Architectural invariants" and ARCHITECTURE-AUDIT-2026-05-30.md.
# NOTE: the `routers ↛ repositories` (thin-router, invariant a) contract is
# intentionally absent until the H1 `ProjectStateService` extraction lands —
# `/state` currently drives repositories directly, so it would fail today.
[tool.importlinter]
root_packages = [
    "workgraph_api",
    "workgraph_agents",
    "workgraph_persistence",
    "workgraph_domain",
    "workgraph_schemas",
    "workgraph_observability",
]

[[tool.importlinter.contracts]]
name = "Services never import the LLM client (invariant c: LLM orchestration lives in packages/agents)"
type = "forbidden"
source_modules = ["workgraph_api.services"]
forbidden_modules = ["workgraph_agents.llm"]
# Services legitimately import agent CLASSES from `workgraph_agents` to
# orchestrate them; that package's __init__ transitively reaches `.llm`.
# The invariant is "no service instantiates/uses LLMClient" — approximated
# as no DIRECT import of the llm module. Indirect reachability is expected.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Packages never import the API app (layering: apps depend on packages, never the reverse)"
type = "forbidden"
source_modules = [
    "workgraph_agents",
    "workgraph_persistence",
    "workgraph_domain",
    "workgraph_schemas",
    "workgraph_observability",
]
forbidden_modules = ["workgraph_api"]

[[tool.importlinter.contracts]]
name = "Consumer services depend on the membrane DTO contract, not the facade (audit M5: no services->membrane cycle)"
type = "forbidden"
source_modules = [
    "workgraph_api.services.decisions",
    "workgraph_api.services.im",
    "workgraph_api.services.kb_items",
    "workgraph_api.services.silent_consensus",
]
forbidden_modules = ["workgraph_api.services.membrane"]
# These four construct MembraneCandidate + read MembraneReview only; they now
# import the DTOs from the leaf `membrane_policies.base`, never the heavy
# `services.membrane` facade. membrane_ingest.py (the ingest facade) and the
# services package __init__ (public surface) legitimately import the facade and
# are intentionally out of scope.
